<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Radar Wi-Fi Indoor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 16px;
    }

    h2 { font-size: 20px; color: #2c3e50; }

    #status-bar {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; color: #555;
    }
    #mqtt-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: orange; flex-shrink: 0;
      transition: background 0.3s;
    }
    #mqtt-dot.online  { background: #2ecc71; }
    #mqtt-dot.offline { background: #e74c3c; }

    /* ── Mapa: ocupa a largura disponível mantendo proporção real da imagem ── */
    #map-container {
      position: relative;
      width: 100%;
      max-width: 620px;
      border: 3px solid #2c3e50;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      background: #fff;
    }

    /* padding-top em % mantém a proporção da imagem sem JS.
       Valor padrão: 112% (planta ~1035×1160). Sobrescrito por JS
       após a imagem carregar para ser sempre exato. */
    #map-inner {
      position: relative;
      width: 100%;
      padding-top: 112%;        /* placeholder antes da imagem carregar */
      overflow: hidden;
    }

    #floorplan {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: fill;         /* preenche exatamente o container */
      display: block;
    }

    /* ── Ponto de localização ── */
    #dot {
      position: absolute;
      width: 22px; height: 22px;
      background: #e74c3c;
      border: 3px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 4px rgba(231,76,60,0.35);
      transition: left 0.9s ease, top 0.9s ease;
      z-index: 10;
      /* começa escondido até receber posição */
      opacity: 0;
      pointer-events: none;
    }

    /* ── Badge de local atual ── */
    #badge {
      position: absolute;
      top: 12px; left: 12px;
      background: rgba(30, 39, 46, 0.88);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      z-index: 20;
      backdrop-filter: blur(4px);
      max-width: calc(100% - 24px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Painel de upload da planta ── */
    #upload-panel {
      width: 100%; max-width: 620px;
      border: 1.5px dashed #aaa;
      border-radius: 10px;
      padding: 14px 20px;
      background: #fff;
      display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap;
    }
    #upload-panel label {
      font-size: 13px; color: #555; white-space: nowrap;
    }
    #upload-panel input[type=file] { font-size: 13px; flex: 1; min-width: 0; }

    /* ── Info box ── */
    #info-box {
      width: 100%; max-width: 620px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: #444;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 20px;
    }
    #info-box span { color: #2c3e50; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Sistema de Posicionamento Indoor</h2>

  <div id="status-bar">
    <div id="mqtt-dot"></div>
    <span id="mqtt-status">Conectando ao broker...</span>
  </div>

  <!-- Upload da planta (opcional — troca sem recarregar a página) -->
  <div id="upload-panel">
    <label for="img-upload">Planta baixa:</label>
    <input type="file" id="img-upload" accept="image/*" />
    <span style="font-size:12px;color:#999;">Padrão: Planta.png na mesma pasta</span>
  </div>

  <!-- Mapa -->
  <div id="map-container">
    <div id="map-inner">
      <img id="floorplan" src="Image/Planta.png" alt="Planta Baixa" />
      <div id="badge">Aguardando localização...</div>
      <div id="dot"></div>
    </div>
  </div>

  <!-- Painel de info -->
  <div id="info-box">
    <div>Local: <span id="info-local">—</span></div>
    <div>Confiança (dist): <span id="info-dist">—</span></div>
    <div>X: <span id="info-x">—</span>%</div>
    <div>Y: <span id="info-y">—</span>%</div>
  </div>

  <script>
    /* ── Ajusta padding-top do inner ao aspect ratio real da imagem ── */
    const floorplan = document.getElementById('floorplan');
    const mapInner  = document.getElementById('map-inner');

    function ajustarAspecto() {
      const ratio = floorplan.naturalHeight / floorplan.naturalWidth;
      if (ratio > 0) mapInner.style.paddingTop = (ratio * 100).toFixed(2) + '%';
    }
    floorplan.addEventListener('load', ajustarAspecto);
    if (floorplan.complete) ajustarAspecto();

    /* ── Troca de imagem via upload sem recarregar ── */
    document.getElementById('img-upload').addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      floorplan.src = url;
      // ajustarAspecto() é chamado pelo evento 'load' acima
    });

    /* ── MQTT ── */
    const MQTT_BROKER = "broker.hivemq.com";
    const MQTT_PORT   = 8884;
    const MQTT_TOPIC  = "ufsc/engenharia/radar/localizacao_final";

    const mqttDot    = document.getElementById('mqtt-dot');
    const mqttStatus = document.getElementById('mqtt-status');
    const dot        = document.getElementById('dot');
    const badge      = document.getElementById('badge');

    const clientId = "web_" + Math.random().toString(16).slice(2, 10);
    const client   = new Paho.MQTT.Client(MQTT_BROKER, MQTT_PORT, "/mqtt", clientId);

    client.onConnectionLost = () => {
      mqttDot.className    = 'offline';
      mqttStatus.textContent = 'Desconectado — reconectando...';
      mqttStatus.style.color = '#e74c3c';
      setTimeout(conectar, 3000);
    };

    client.onMessageArrived = (msg) => {
      try {
        const d = JSON.parse(msg.payloadString);

        /* Move o ponto — coordenadas em % (0–100) geradas pelo Python */
        dot.style.left    = d.x + '%';
        dot.style.top     = d.y + '%';
        dot.style.opacity = '1';

        badge.textContent = 'Local: ' + d.local;

        document.getElementById('info-local').textContent = d.local;
        document.getElementById('info-x').textContent     = d.x;
        document.getElementById('info-y').textContent     = d.y;
        document.getElementById('info-dist').textContent  = d.confianca !== undefined ? d.confianca : '—';

      } catch (e) {
        console.error('Payload inválido:', e);
      }
    };

    function conectar() {
      client.connect({
        useSSL: true,
        onSuccess: () => {
          mqttDot.className      = 'online';
          mqttStatus.textContent = 'Conectado ao broker';
          mqttStatus.style.color = '#2ecc71';
          client.subscribe(MQTT_TOPIC);
        },
        onFailure: (err) => {
          mqttDot.className      = 'offline';
          mqttStatus.textContent = 'Falha — tentando novamente...';
          mqttStatus.style.color = '#e74c3c';
          setTimeout(conectar, 4000);
        }
      });
    }

    conectar();
  </script>
</body>
</html>
